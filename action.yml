name: Jev PR Labeler
description: Classify PR labels after a completed Greptile review, using semantic scope.
inputs:
  github-token:
    description: GitHub token with checks read and pull-requests/issues write permissions
    required: true
  openrouter-api-key:
    description: OpenRouter API key authorized to use Jev. When empty, the action skips labeling and succeeds.
    required: false
    default: ''
  repository:
    description: GitHub owner/repository
    required: true
  pull-request:
    description: Positive PR number (exclusive with check-sha)
    default: ''
  check-sha:
    description: Completed check head SHA, resolved to matching current open PRs
    default: ''
  require-greptile:
    description: Wait for a completed current-head Greptile review. Explicit opt-out for independent deployments.
    default: 'true'
  apply:
    description: Set to true to apply labels. Default is dry-run.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Classify PR using trusted action code only
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        LABEL_REPOSITORY: ${{ inputs.repository }}
        LABEL_PR: ${{ inputs.pull-request }}
        LABEL_CHECK_SHA: ${{ inputs.check-sha }}
        LABEL_REQUIRE_REVIEW: ${{ inputs.require-greptile }}
        LABEL_APPLY: ${{ inputs.apply }}
      run: |
        cd "$GITHUB_ACTION_PATH"
        # Forks and repositories without the secret cannot label anything. Skip
        # instead of failing so a missing key never becomes a permanently red check.
        if [[ -z "${OPENROUTER_API_KEY//[[:space:]]/}" ]]; then
          echo '::notice title=Jev PR Labeler::OPENROUTER_API_KEY is not configured; skipping labeling.'
          exit 0
        fi
        args=(--repo "$LABEL_REPOSITORY")
        if [[ -n "$LABEL_PR" && -z "$LABEL_CHECK_SHA" ]]; then
          args+=(--pr "$LABEL_PR")
        elif [[ -n "$LABEL_CHECK_SHA" && -z "$LABEL_PR" ]]; then
          args+=(--check-sha "$LABEL_CHECK_SHA")
        else
          echo 'Provide exactly one of pull-request or check-sha' >&2
          exit 1
        fi
        if [[ "$LABEL_REQUIRE_REVIEW" == "false" ]]; then
          args+=(--without-greptile)
        elif [[ "$LABEL_REQUIRE_REVIEW" != "true" ]]; then
          echo 'require-greptile must be true or false' >&2
          exit 1
        fi
        if [[ "$LABEL_APPLY" == "true" ]]; then
          args+=(--apply --ensure-labels)
        elif [[ "$LABEL_APPLY" != "false" ]]; then
          echo 'apply must be true or false' >&2
          exit 1
        fi
        python3 -m jev_labeler.after_review "${args[@]}"
