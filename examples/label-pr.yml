# Install as .github/workflows/label-pr.yml in the repository being labeled.
name: Semantic PR labels
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: jev-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # IMPORTANT: pin to a reviewed full commit SHA before enabling.
      # Never check out the PR branch or execute its scripts with these permissions.
      - uses: 1jehuang/jev-pr-labeler@REPLACE_WITH_REVIEWED_COMMIT_SHA
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          repository: ${{ github.repository }}
          pull-request: ${{ github.event.pull_request.number }}
          apply: 'true'
